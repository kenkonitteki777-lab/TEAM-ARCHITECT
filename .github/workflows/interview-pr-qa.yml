name: Interview PR quality gate
on:
  pull_request:
    paths:
      - 'public/interview/**'
      - 'tests/**'
      - '.github/workflows/interview-pr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify interview domain tests
        run: npm run test:interview
      - name: Verify main application remains valid
        run: npm run typecheck && npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Interview browser regression (mobile and desktop)
        run: npx playwright test tests/e2e/interview-question-bank.spec.ts tests/e2e/interview-quality.spec.ts tests/e2e/interview-shell.spec.ts --workers=2
