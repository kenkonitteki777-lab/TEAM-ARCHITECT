name: Deploy TEAM ARCHITECT to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Verify interview trainer
        run: npm run test:interview

      - name: Typecheck and domain tests
        run: npm run typecheck && npm test

      - name: Build
        run: npm run build

      - name: Cache distinct interview audio
        id: interview-audio
        uses: actions/cache@v4
        with:
          path: .interview-audio/audio
          key: interview-voicevox-0.25.2-${{ hashFiles('public/interview/questions.js', 'public/interview/voice-catalog.js', 'scripts/generate-interview-audio.py', 'scripts/interview_prosody.py') }}

      - name: Generate distinct Japanese interviewer voices
        if: steps.interview-audio.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          docker run -d --name interview-voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-0.25.2@sha256:eb8c7f46a7d01217d1ff2b6f018261faedeceded3cc756b4fbbf371791ad6c90
          node scripts/export-interview-audio.mjs > /tmp/interview-voice-catalog.json
          python3 scripts/generate-interview-audio.py --catalog /tmp/interview-voice-catalog.json --output .interview-audio
          docker stop interview-voicevox

      - name: Include generated interview audio
        run: cp -R .interview-audio/audio dist/interview/audio

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Verify startup recovery and application workflows
        run: npm run test:e2e -- --workers=2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

