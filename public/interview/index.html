<aside class="p side">
<h3>このアプリの基準</h3>
<div class="item"><b>① 過去試験</b><br>過去資料にある質問・解答例を優先。</div>
<div class="item"><b>② あなたの回答</b><br>あなたが作ってきた回答をそのまま確認。</div>
<div class="item"><b>③ 面接官別</b><br>武山部長／社長で見るポイントを切り替える。</div>
<div class="item"><b>④ 西日本視点</b><br>利益・現場・人材・挑戦・シェアまで確認。</div>
<div class="item"><b>⑤ 次の深掘り</b><br>「なぜ？」「具体的には？」「利益は？」を想定。</div>

<script>
const Q=[
{m:"take",t:"どんな店長になりたいか",q:"どんな店長になりたいですか？",mine:"利益を残し、稼働でも対抗店に勝つ一番店を、スタッフが楽しく働き、お客様に愛される形でつくる店長。結果と人の両方を取る。",model:"カンパニーでNo1の店長。業績も人望も1番を目指す。まず既存店で市場No1の店を作り、その後、新店を成功させられる店長になる。",src:"上田・武山部長WEB面接"},
{m:"take",t:"なぜ店長になりたいか",q:"なぜ店長になりたいですか？",mine:"入社時からの夢。最終判断と責任を引き受けたい。遠回りこそ最大の近道で、責任の重い道を選ぶ。南宮崎の悔しさと羽曳野の反省を、結果で返したい。",model:"ビジョンはマルハンを日本一の企業にし、その中心で活躍すること。店長はゴールではなく通過点で、将来はエリアやカンパニーを牽引する。",src:"2025PDF・武山部長面接対策"},
{m:"take",t:"強いマルハン",q:"強いマルハンとは何ですか？今は強いですか？",mine:"他社が何をしても上回る状態。少しずつ取り戻しているが、共感して動く人がまだ足りない。店長として、その人を増やす。",model:"他社が何をやってきても上回る状態。店舗では、店長が中心となり、CSも社員も関係なく全力で行動できる状態。現状は少しずつ強さを取り戻しつつあるが、共感して行動できる人が足りない。",src:"上田・武山部長WEB面接"},
{m:"take",t:"西Cの問題",q:"西日本カンパニーの問題点は？イズムに絡めて答えてください。",mine:"挑戦し続ける組織。対抗店への対応が後手、フローが遅い。共感参画型組織。社長の想いに熱く共感して動く人が少ない。",model:"挑戦し続ける組織は、新しいことへのチャレンジが足りず後手になっている。「できない理由でなく、できることを考える」。共感参画型は、店長が変わらない店舗はMGRもスタッフも変わらない。店長が伝道者になる。",src:"上田・2025PDF"},
{m:"take",t:"変わらない店長",q:"変わらない店長をどう思いますか？",mine:"変わってきたが、店舗の状況に依存して挑戦を止めている店長もいる。悔しいし、自分たちの世代が良くしていく思いが強まる。",model:"変わってきたが、今は停滞している。店舗の状況に依存して上を目指さず、下が育たない悪循環。私たち新しい世代が変える。変わらない店長には悔しい。",src:"2025PDF"},
{m:"take",t:"10年後の業界",q:"10年後、パチンコ業界はどうなっていると思いますか？",mine:"店舗数は減り、少数の法人による寡占化が進む。マルハンも安泰ではなく、シェア拡大の努力が欠かせない。",model:"さらに縮小し、シェアの奪い合い。中小は淘汰される。ただし逆にチャンスで、シェアを広げれば、対抗店との奪い合いや、メーカーへの影響力で優位に立てる。新規事業も同時に進める。",src:"2025PDF"},
{m:"take",t:"本物の人材",q:"本物の人材とは？",mine:"どんな環境でも諦めず、自ら考えて行動し、利益という結果につなげる人。",model:"自ら考え行動し、どんな困難でも諦めず結果につなげる人。会社に利益をもたらし、成長を止めず、周りを引き付ける存在。",src:"52期・2025PDF"},
{m:"take",t:"一番辛かったこと",q:"これまで一番辛かったことは？",mine:"南宮崎。全力を尽くしたが結果が出ず、短期間で異動。準備と判断の不足が原因。悔しさがひよらない強さの源。",model:"南宮崎店の失敗。会社に多大な迷惑をかけた。同じことを繰り返さないよう、全員で考えて動き、結果、巻き返せた。失敗から、集客と定着のプロセス、利益の伸ばし方を学んだ。",src:"2025PDF"},
{m:"take",t:"南宮崎の責任",q:"南宮崎が失敗した理由は？誰の責任ですか？",mine:"準備と具体策が足りなかった。責任は関わった全員で、その中で自分は果たすべき役割を果たせなかった。特定個人は名指ししない。",model:"最大の店舗のグランドオープンは、もっとインパクトのあるものにすべきだった。告知も当日の演出も足りなかった。責任は関わった全員。",src:"前田・2025PDF"},
{m:"take",t:"現場主義",q:"現場主義とは？",mine:"理論より、自分の目で現場を見て実践すること。特定日は先頭に立ち、調整を店長と詰め、振り返りまで行う。",model:"理論や計画より現場での実践・経験を重視し、机上でなく自ら足を運ぶこと。特定日強化で必ず出勤し、調整を店長と考え、ホールオペレーションも率先して行い、振り返りまで行う。",src:"52期"},
{m:"take",t:"KINGS NEVER DIE",q:"KINGS NEVER DIEをどう捉えていますか？",mine:"決まったことをやるだけでなく、その時のベストを考えて素早く実行する。結果が出ない施策は止めて切り替える。",model:"寝ている場合ではない。決まったことをやっていてはダメ。常にその時のベストを考え、スピーディーに実行する。",src:"前田"},
{m:"take",t:"着任初日の朝礼",q:"店長着任初日の朝礼で何を話しますか？",mine:"店の現場を自分の目で見て、この店にしかない強みを確信する。物量で張り合わず、強みへの選択と集中で利益を残す。スタッフが楽しく働ける店にする。人の気持ちは得意ではないので、思ったことは遠慮なく言ってほしい。",model:"チームとして協力し、この店を市場でNo1にする使命がある。常に「お客様に楽しんでいただくためにはどうするべきか」を考え、行動してほしい。",src:"上田"},
{m:"take",t:"着任後の初動",q:"着任したら最初に何をしますか？",mine:"1〜2週間は現場に立ち、数字と現場感覚のズレを検証。スタッフ一人ひとりと、なぜこの店で働くかを話す。",model:"結果が出ていること・いないことを精査し、出ていないことはやめる。新しいことを実行する。対抗店との差別化ポイントを見つける。全員面談で課題を抽出する。",src:"上田"},
{m:"take",t:"リーダーシップ",q:"リーダーシップとは？",mine:"誰よりも早く課題を見つけ、感情に流されず効率的な解決策を示し、決定の責任を自分で取ること。同時に、独善にならずスタッフを巻き込む。",model:"自ら考え行動し、結果につなげるだけでなく、周囲を巻き込み、チームとして成果を出すこと。",src:"資料全体からの構成参考"},
{m:"take",t:"弱み",q:"あなたの弱みは？どう克服していますか？",mine:"論理を優先して、相手の感情を汲むのに時間がかかる。だから、何かを始める・変える・連携するときは、必ず「どう思う？」と聞く。",model:"弱みを自覚した上で、周囲の意見を聞き、チームとして動く。自分だけで答えを出さず、対話によって周囲を巻き込む。",src:"自分の回答案＋資料構成参考"},
{m:"take",t:"羽曳野の問題",q:"なぜ羽曳野で利益が取れなかったのですか？",mine:"対抗店の物量と稼働にこだわり、利益に舵を切るのが遅れた。準備と判断の不足が原因。",model:"稼働を追い過ぎ、採算の見込めない機械購買や販促を続けて消耗戦から脱却できなかった。稼働という軸にこだわり、メリハリをもって利益に舵を切るタイミングを逸した。",src:"自分の回答案"},
{m:"take",t:"利益の考え方",q:"入金が取れる店長と取れない店長の違いは？",mine:"金額にひるまず判断する胆力と、細部の営業分析。計画を緻密に立て、暴発時のリカバリーを早く判断し、赤字機種をタイムリーに見ているかが差になる。",model:"金額にひるまず判断する胆力と、細部の営業分析。暴発時のリカバリーを早く判断し、赤字機種をタイムリーに見ているかが差になる。",src:"自分の回答案"},
{m:"take",t:"カンパニーの課題",q:"カンパニーの良い点・悪い点は？",mine:"良い点は、現場を大事にするリーダーが増えたこと、経費管理の徹底。悪い点は、他カンパニーとの情報共有の弱さ、機械購買のメリットを生かし切れないこと。",model:"良い点は、上司が現場目線になったこと、チャンスが増えたこと、目標が明確になったこと。悪い点は、情報交換やスケールメリットを生かし切れていないこと。",src:"52期・2025PDF"},
{m:"take",t:"新規事業",q:"マルハンの新規事業を考えるなら？",mine:"遊休資産を活用し、初期投資を抑えて小さく始め、採算を確認してから全国展開する。駐車場・遊休スペースの活用、ウェルネス、モビリティなどを考える。",model:"ヘルス&ウェルネス型アミューズメント、パチンコ×eスポーツ×カジノライク体験、ゲーミング&フードパークなど。強みは規模・資金・人財、弱みはノウハウ・実行力。",src:"2025PDF・前田"},
{m:"west",t:"MIRACLE WORLD",q:"MIRACLE WORLDを成功させるには？",mine:"一度の来場で終わらせず、再来場や口コミにつなげる。季節コンテンツ、SNS発信、なんば周辺との連携、来場データを活用し、利益が残る集客モデルを作る。",model:"施設単体の集客だけでなく、体験価値を継続的に高め、国内客・インバウンド双方に選ばれる仕組みを作る。",src:"面接対策用の構成案"},
{m:"pres",t:"社長・店長を任せる覚悟",q:"お前に店長を任せても大丈夫か？",mine:"はい。どの店舗を任されても、入金を取りに行き、利益を残す覚悟があります。南宮崎と羽曳野で失敗した経験があるからこそ、準備と判断に妥協しません。",model:"はい。店長は結果と責任を引き受ける仕事だと理解しています。任された以上、言い訳せず、現場を見て、必要な判断をして結果を出します。",src:"社長面接想定"},
{m:"pres",t:"社長・なぜあなた",q:"なぜ、あなたを店長にする必要がある？",mine:"課題形成から課題解決までの判断スピード、数字から勝ち筋を見つける力、そして失敗から逃げない強さがあります。人を動かす力は課題ですが、そこも自覚して「どう思う？」と聞き、チームで結果を出します。",model:"自分で考えて動き、結果まで責任を持てる人材であることを示す。強みだけでなく弱みと向き合い、周囲を巻き込んで成果を出す。",src:"資料全体からの構成参考"},
{m:"pres",t:"社長・羽曳野黒字",q:"羽曳野を黒字にできるのか？",mine:"はい、やります。物量で張り合うのではなく、強みへの集中投資と経費の最適化で利益を残します。取る時に取る、出す時に出すというメリハリを徹底します。",model:"厳しい環境でも、利益を残すために必要な判断をする。現状を言い訳にせず、投資と経費を見直し、黒字転換までやり切る。",src:"自分の回答案・社長面接想定"},
{m:"pres",t:"社長・失敗",q:"南宮崎や羽曳野の失敗から何を学んだ？",mine:"気持ちだけでは勝てないことです。準備と具体策、そして利益に舵を切る判断が必要だった。だから今は、打ち手の前に目的と検証方法を決め、結果が出なければ早く変えます。",model:"失敗を他責にせず、自分の準備と判断の不足を認める。その経験を次の判断基準に変え、同じ失敗を繰り返さない。",src:"自分の回答案・2025PDF"},
{m:"west",t:"イズム",q:"マルハンイズムで一番大事なのは？",mine:"経営理念の「人生にヨロコビを」だと考えています。各項目は最終的にここにつながる。個別の言葉を覚えるだけでなく、この判断は誰にどんなヨロコビを生むのかまで考えることが大切です。",model:"経営理念「人生にヨロコビを」を最上位の軸として、組織理念・行動指針を日々の判断に落とし込む。",src:"マルハン公式ISMを踏まえた面接整理"},
{m:"west",t:"イズムの必要性",q:"マルハンイズムは必要ですか？",mine:"はい、必要だと思います。店や上司によってイズムの捉え方に多少のバラツキがあるからこそ必要です。イズムは覚えるものではなく、マルハンとして何を大切にするのか、判断や行動の軸を揃えるもの。店長になったら、なぜこの仕事をするのかまでスタッフと共有します。",model:"イズムを共通の判断軸として捉え、店舗ごとの解釈の違いをなくすのではなく、経営理念から日々の行動まで一貫させる。",src:"マルハン公式ISMを踏まえた面接整理"},
{m:"west",t:"西日本で変えること",q:"西日本カンパニーを変えるなら何を変える？",mine:"挑戦し続ける組織を強くしたい。対抗店への対応や新しい打ち手が後手になる状態を、自分たちの世代から変える。できない理由ではなく、できることを考え、店長自身が先頭に立つ。",model:"新しいことへのチャレンジを止めず、できない理由ではなくできることを考える。店長が伝道者となり、周囲を動かす。",src:"上田・2025PDF"}
{m:"today",t:"前回社長面接",q:"前回の社長面接はなぜだめだったと思うか？",mine:"未記録",model:"他人や環境のせいにせず、自分の準備・判断・伝え方の不足として整理する。失敗を次の行動に変えたことまで話す。",src:"本日実戦質問。回答内容は未記録"},
{m:"today",t:"行動変化",q:"どう行動を変えたか？",mine:"未記録",model:"失敗を反省するだけで終わらせず、準備、現場確認、利益判断、周囲との対話など、具体的な行動に変えたことを示す。",src:"本日実戦質問。回答内容は未記録"},
{m:"today",t:"前崎店長",q:"前崎店長になって変わったことはあるか？",mine:"未記録",model:"現在の店舗運営で、自分の判断や行動がどう変化したかを具体例で答える。特に利益への向き合い方、細部の精査、現場での行動変化を整理する。",src:"本日実戦質問。回答内容は未記録"},
{m:"today",t:"利益への行動",q:"利益がとれないことに対してなにか行動しているか？",mine:"細かい機種の無駄玉など、徹底的に精査し、利益を残すために全力を尽くしております。今期は少しでも赤字額を減らすため細かい部分まで確認して利益を残してまいります。",model:"利益が取れないことを数字だけで見るのではなく、細かい機種の無駄玉などまで徹底的に精査する。取る時に取る、出す時に出すというメリハリを持ち、赤字を減らして利益を残す。",src:"自分の回答案・本日実戦"},
{m:"today",t:"稼働率目標",q:"稼働率の目標はあるか？",mine:"未記録",model:"本日回答の具体的な数値は未記録。数値を補完せず、目標値、その根拠、達成するための施策までセットで答える。",src:"本日実戦質問。数値は補完しない"},
{m:"today",t:"稼働向上施策",q:"稼働を高めていくためにやっている施策はあるか？",mine:"未記録",model:"施策名だけでなく、誰を対象に、何を変え、どの数字で効果を検証するかまで答える。競合の物量を追うだけではなく、自店の強み・差別化につなげる。",src:"本日実戦質問。回答内容は未記録"},
{m:"today",t:"自店着地",q:"自店の着地は？予算に対して",mine:"未記録",model:"本日回答の実績・予算差は未記録。数値は補完せず、着地見込み→予算差→要因→残り期間で何をするか、の順で答える。",src:"本日実戦質問。数値は補完しない"},

function render(){const x=pool[idx];$("chips").innerHTML='<span class="chip">'+(x.m==="take"?"武山部長":x.m==="pres"?"社長":x.m==="west"?"西日本・経営":x.m==="today"?"本日実戦":"総合")+'</span><span class="chip">'+x.t+'</span>';$("count").textContent=(idx+1)+" / "+pool.length;$("q").textContent=x.q;$("out").innerHTML=""}
