<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="description" content="店長面接の質問と模範解答を、すばやく確認。">
<title>面接対策 · TEAM ARCHITECT</title>
<link rel="preload" href="./fonts/interview-sans-jp-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./reader.css?v=20261007-carbon2">
</head>
<body>
<header class="header"><div class="header-inner"><a href="./" class="brand"><span class="brand-mark" aria-hidden="true">A<span></span></span><span>INTERVIEW<small>TEAM ARCHITECT · 店長面接</small></span></a><button id="openMenu" class="quiet" aria-haspopup="dialog" aria-controls="navigation">質問一覧 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></header>
<main id="reader">
<div class="eyebrow"><span class="topic"><i></i><span id="category"></span></span><span id="position"></span></div>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
<section class="question-stage" aria-labelledby="question"><span class="section-label">QUESTION <span id="questionId"></span></span><h1 id="question"></h1><p id="recallHint" class="recall-hint"></p></section>
<section id="modelPanel" class="model" aria-labelledby="answerLabel" hidden><div class="answer-head"><h2 id="answerLabel">模範解答</h2><div><span id="answerOrigin" class="answer-origin"></span><button id="editAnswer" class="edit-button">編集する <span aria-hidden="true">↗</span></button></div></div><p id="answer"></p><section id="followups" class="followups" aria-label="追撃質問と模範解答"></section><p id="provenance" class="provenance"></p></section>
</main>
<footer class="dock"><div class="dock-inner"><button id="prev" class="nav-step" aria-label="前の質問"><span aria-hidden="true">←</span><span>前へ</span></button><button id="reveal" class="primary" aria-controls="modelPanel" aria-expanded="false">模範解答を見る <span aria-hidden="true">＋</span></button><button id="next" class="nav-step" aria-label="次の質問"><span>次へ</span><span aria-hidden="true">→</span></button></div><p class="keyhint">← → 質問を移動 <span>SPACE 解答を表示</span></p></footer>
<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-head"><div><span class="section-label">YOUR ANSWER</span><h2 id="editorTitle">模範解答を編集</h2></div><button id="closeEditor" class="quiet" aria-label="編集画面を閉じる">閉じる ×</button></div><p id="editorQuestion" class="editor-question"></p><label class="sr-only" for="modelText">登録する模範解答</label><textarea id="modelText" maxlength="12000" rows="9" placeholder="自分の言葉で模範解答を登録"></textarea><div class="editor-meta"><span id="draftStatus"></span><span id="editChars"></span></div><div class="editor-footer"><p>この端末に保存。バックアップで移行できます。</p><button id="saveModel" class="primary" disabled>保存する <span aria-hidden="true">✓</span></button></div></dialog>
<dialog id="navigation" aria-labelledby="menuTitle"><div class="dialog-head"><h2 id="menuTitle">質問一覧</h2><button id="closeMenu" class="quiet" aria-label="メニューを閉じる">閉じる ×</button></div><div class="filters"><label class="sr-only" for="search">質問・模範解答を検索</label><input id="search" type="search" placeholder="質問・模範解答を検索" autocomplete="off"><label class="sr-only" for="categoryFilter">カテゴリー</label><select id="categoryFilter"><option value="">すべてのカテゴリー</option></select></div><p id="resultCount" class="muted"></p><div id="questionList"></div><details class="backup"><summary>保存データ・バックアップ</summary><p id="storageDetail" class="muted">過去の回答履歴は、この端末に保持しています。</p><button id="export" class="secondary">バックアップを書き出す</button><label class="import secondary">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label><details><summary>過去の回答履歴</summary><div id="history"></div></details></details></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="./reader.js?v=20261007-editor1"></script>
</body></html>
