<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店長昇進面接トレーナー</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf5ff;font-family:system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #24364e;background:#0b1728;position:sticky;top:0;z-index:5}.w{max-width:1050px;margin:auto}.ey{font-size:11px;letter-spacing:.18em;color:#67dcff;font-weight:800}.t{font-size:24px;font-weight:900}.s{font-size:12px;color:#8ea5bb}main{padding:16px 12px 50px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #293e58;border-radius:11px;padding:10px 14px;background:#142238;color:#eef6ff;font-weight:800;cursor:pointer}.active,.primary{background:#67dcff;color:#03111b;border-color:#67dcff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:13px}.p{background:#0c192b;border:1px solid #21344d;border-radius:19px;padding:18px}.chips{display:flex;gap:6px}.chip{font-size:11px;background:#16283e;padding:5px 8px;border-radius:99px;color:#a9bfd2}.q{font-size:27px;line-height:1.45;margin:15px 0 8px}.hint{font-size:12px;color:#8ea5bb;line-height:1.7}textarea{width:100%;min-height:205px;background:#06101c;border:1px solid #2a425e;border-radius:14px;color:#fff;padding:14px;font-size:16px;line-height:1.75}textarea:focus{outline:none;border-color:#67dcff}.actions{display:flex;gap:8px;margin-top:9px}.actions button:first-child{flex:1}.box{margin-top:13px;padding:15px;background:#07111e;border:1px solid #223750;border-radius:15px}.score{font-size:45px;font-weight:950}.score span{font-size:12px;color:#8096aa}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:9px}.metric{background:#102138;border-radius:9px;padding:7px;font-size:10px}.metric b{display:block;font-size:16px}.ok{color:#70e1a4}.mid{color:#ffd66d}.low{color:#ff9090}.follow button{display:block;width:100%;text-align:left;margin:6px 0;background:#302815;color:#ffe3a0}.model{white-space:pre-wrap;background:#0d2035;border-radius:10px;padding:11px;line-height:1.7;margin-top:8px}.axis{padding:9px 0;border-bottom:1px solid #1c2d43}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1c2d43}.hist{padding:8px 0;border-bottom:1px solid #1c2d43;font-size:11px}.small{color:#8298ad;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.metrics{grid-template-columns:repeat(3,1fr)}.q{font-size:23px}} .answer-tabs{display:flex;gap:8px;margin-top:12px}.answer-tabs button{flex:1}.model{white-space:pre-wrap} </style></head><body>
<header><div class="w"><div class="ey">MANAGER PROMOTION INTERVIEW</div><div class="t">店長昇進面接トレーナー</div><div class="s">マルハン西日本カンパニー｜実戦練習版</div></div></header>
<main class="w"><div class="bar"><button class="active" data-mode="武山部長">武山部長</button><button data-mode="社長">社長</button><button data-mode="ランダム">ランダム</button><button id="weak">弱点集中</button><button id="reset">履歴削除</button></div><div class="layout"><section class="p"><div id="chips" class="chips"></div><div class="s" id="count"></div><div class="q" id="q"></div><div class="hint">結論→理由→具体策・経験。社長モードは特に短く、聞かれたことに答える。</div><div class="actions"><button class="primary" id="show">解答を見る</button><button id="next">次の質問</button></div><div id="out"></div></section><aside class="p side"><h3>評価軸</h3><div class="axis">結論</div><div class="axis">具体性</div><div class="axis">論理</div><div class="axis">自分の経験</div><div class="axis">イズム・利益</div><div class="axis">簡潔さ</div><div class="stat"><span>回答数</span><b id="n">0</b></div><div class="stat"><span>平均</span><b id="avg">—</b></div><div class="stat"><span>最大</span><b id="max">—</b></div><h3>直近</h3><div id="hist"></div><p class="hint">今回の想定問答の原点・羽曳野・南宮崎・利益・人材・イズム・新規事業を中心に収録。</p></aside></div></main>
<script>
const Q=[
["志望動機","なぜ店長になりたいのですか？","入社したときからの夢です。最終判断と結果の責任を自分で引き受けたい。遠回りこそ最大の近道。南宮崎と羽曳野の失敗を結果で返したい。","ビジョンはマルハンを日本一の企業にし、その中心で活躍すること。店長はゴールではなく通過点で、将来はエリアやカンパニーを牽引する。"],
["店長像","どんな店長になりたいですか？","利益を残し、稼働でも対抗店に勝つ一番店を、スタッフが楽しく働き、お客様に愛される形でつくる店長。結果と人の両方を取る。","カンパニーでNo1の店長。業績も人望も1番を目指す。まず既存店で市場No1の店を作り、その後、新店を成功させられる店長になる。"],
["責任","店長でないとできないことは？","営業のジャッジ、経費の決裁、失敗の責任は店長にしか負えない。","分析や提案はスタッフでもできるが、営業のジャッジ、経費の決裁、失敗の責任は店長にしか負えない。"],
["強み","あなたの強みは？","課題形成から課題解決までの判断スピード。現状把握から最も効率的な解決策を導く。","判断スピードと戦略性を強みに、課題を整理して最も効果の高い施策を選び、実行する。"],
["弱み","あなたの弱みは？","論理を優先して相手の感情を汲むのに時間がかかる。「どう思う？」と聞くことで補う。","自分の考えを優先しすぎることがある。だからこそ周囲に意見を聞き、チームで判断することを意識する。"],
["初動","着任したら最初に何をしますか？","現場に立ち、数字と現場感覚のズレを検証。スタッフ一人ひとりと「なぜこの店で働いているか」を話す。","結果が出ていること・出ていないことを精査し、全員面談で課題を抽出する。対抗店との差別化ポイントも見つける。"],
["人材","本物の人材とは？どう育てる？","どんな環境でも結果を出す主体的で愛社精神のある人。権限を段階的に渡し、問いかけ、環境を変えて経験させ、本人に検証させる。","自ら考え行動し、どんな困難でも諦めず結果につなげる人。会社に利益をもたらし、成長を止めず、周りを引き付ける存在。"],
["失敗","一番辛かった経験は？","南宮崎。全力を尽くしたが結果が出ず異動。準備と判断不足を認め、目的と検証方法を決める習慣につながった。","南宮崎店の失敗。会社に多大な迷惑をかけた。同じことを繰り返さないよう全員で考えて動き、失敗から集客と定着のプロセス、利益の伸ばし方を学んだ。"],
["羽曳野","羽曳野で利益が取れなかった原因は？","対抗店の物量と稼働にこだわり、利益に舵を切るのが遅れた。南宮崎も羽曳野も準備と判断の不足。","稼働を追うことに意識が偏り、利益とのバランスを取る判断が遅れた。"],
["利益","「とる時にとる、出す時に出す」とは？","営業にメリハリをつける。メイン機も強気で締めてとるときはとるという姿勢を徹底する。","営業にメリハリをつけ、取るべきところでは取る。お客様に支持される価値を守りながら利益を残す。"],
["競合","アロー・123などに勝つには？","物量では勝てない。ジャグラーへの集中、低貸の死守、独自の大海で差別化。","同じ土俵で物量勝負をするのではなく、自店が勝てる領域へ集中して差別化する。"],
["新規事業","新規事業をやるなら？","郊外の閉店店舗跡地を使う3案（セルフストレージ、全天候型ウェルネスパーク、EV充電ハブ）。","ヘルス&ウェルネス型アミューズメント、パチンコ×eスポーツ×カジノライク体験、ゲーミング&フードパーク。"],
["MIRACLE WORLD","MIRACLE WORLDに改善点があるとすれば？","一回の来場で終わらせずリピート・口コミへ。季節コンテンツ、SNS、なんばのホテル・飲食・観光との導線、データ検証。","施設を一回の来場で終わらせず、リピートや口コミにつなげる仕組みを作る。来場者数だけでなく再来場率や利益も見る。"],
["イズム","マルハンイズムで一番大事なのは？","経営理念の「人生にヨロコビを」。各項目は最終的にここにつながる。","経営理念の「人生にヨロコビを」だと考える。イズムの各項目は最終的にこの理念につながっている。"],
["組織","西日本カンパニーの課題は？","挑戦し続ける組織（対抗店への対応が後手、フローが遅い）と、共感参画型組織（社長の想いに熱く共感して動く人が少ない）。","挑戦し続ける組織は新しいことへのチャレンジが足りず後手になっている。店長が変わらない店舗はMGRもスタッフも変わらない。店長が伝道者になる。"],
["AI","今挑戦していることは？","AIを使った分析ツールの自作。作業を効率化し、浮いた時間を現場とスタッフに使う。","AIを活用して分析や業務を効率化し、現場で使える時間を増やす。"],
["社長","店長を任せても大丈夫ですか？","はい。どの店舗に任されても、入金を取りに行き、利益を残し、諦めない。","はい。任された店舗で結果を出すことに責任を持ち、利益を残します。"],
["社長","今の羽曳野を任されたら黒字にできますか？","はい。強みへの集中投資と経費の最適化で黒字転換を計画する。厳しくても自分でコントロールできる部分を徹底する。","はい。数字と現場を分解し、利益への影響が大きいところから止血し、黒字にします。"],
["社長","なぜあなたを店長にする必要がありますか？","判断スピード、戦略性、現場主義、失敗から逃げない強さ。","結果にこだわり、失敗から逃げず、判断して実行できること。"]
];

let index=0;
const qEl=document.getElementById("q"), out=document.getElementById("out"), count=document.getElementById("count"), chips=document.getElementById("chips");
function render(){
 const x=Q[index];
 chips.innerHTML='<span class="chip">'+x[0]+'</span>';
 count.textContent=(index+1)+' / '+Q.length;
 qEl.textContent=x[1];
 out.innerHTML='';
}
document.getElementById("show").addEventListener("click",function(){
 const x=Q[index];
 out.innerHTML='<div class="box"><div class="hint"><b>模範解答</b></div><div class="model">'+x[3]+'</div><div class="hint" style="margin-top:16px"><b>私の回答例</b></div><div class="model">'+x[2]+'</div></div>';
});
document.getElementById("next").addEventListener("click",function(){
 index=(index+1)%Q.length;
 render();
});
document.querySelectorAll("[data-mode]").forEach(function(b){
 b.addEventListener("click",function(){
   document.querySelectorAll("[data-mode]").forEach(function(z){z.classList.remove("active")});
   b.classList.add("active");
   index=0;
   render();
 });
});
render();
</script></body></html>
