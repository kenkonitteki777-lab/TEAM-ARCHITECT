<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="description" content="店長面接の質問と模範解答を、すばやく確認。">
<title>面接対策 · TEAM ARCHITECT</title>
<link rel="preload" href="./fonts/interview-sans-jp-semibold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./reader.css?v=20261010-noir1">
</head>
<body>
<header class="header"><div class="header-inner"><a href="./" class="brand"><span class="brand-mark" aria-hidden="true"><svg width="32" height="36" viewBox="0 0 32 36" fill="none"><path d="M3 29 16 5l13 24M9 19h14" stroke="currentColor" stroke-width="2"/><path d="M12 29h8" stroke="#c5d3b5" stroke-width="2"/></svg></span><span>INTERVIEW<small>TEAM ARCHITECT · 店長面接</small></span></a><button id="openMenu" class="quiet" aria-haspopup="dialog" aria-controls="navigation">質問一覧 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></header>
<main id="reader">
<div class="practice-switch" role="group" aria-label="練習する面接官"><button data-interviewer="department" aria-pressed="true"><span>部長</span><small>経験・人材・イズム</small></button><button data-interviewer="president" aria-pressed="false"><span>社長</span><small>利益・判断・挑戦</small></button></div>
<div class="practice-caption"><span id="practiceHint">部長面接を練習</span><button id="openProfile" aria-haspopup="dialog" aria-controls="profile">社長の評価軸 ↗</button></div>
<div class="eyebrow"><span class="topic"><i></i><span id="category"></span><span id="interviewerLabel" class="interviewer-label">部長面接</span></span><span id="position"></span></div>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
<section class="question-stage" aria-labelledby="question"><div class="question-copy"><span class="section-label">QUESTION <span id="questionId"></span></span><h1 id="question"></h1><p id="recallHint" class="recall-hint"></p></div><aside id="coach" class="coach" aria-label="部長をイメージした面接キャラクター"><div class="coach-portrait"><span class="coach-orbit" aria-hidden="true"></span><img id="coachImage" src="./assets/department-noir-v1.webp" width="560" height="840" alt="部長面接のシルエット" fetchpriority="high"></div><div class="coach-identity"><span id="coachName" class="coach-name">部長</span><span id="coachMotto" class="coach-motto">ひよらない強さ。</span></div></aside></section>
<section id="modelPanel" class="model" aria-labelledby="answerLabel" hidden><div class="answer-head"><h2 id="answerLabel">模範解答</h2><div><span id="answerOrigin" class="answer-origin"></span><button id="editAnswer" class="edit-button">編集する <span aria-hidden="true">↗</span></button></div></div><p id="answer"></p><details class="answer-notes"><summary>回答の核・面接官が確認する点</summary><p id="answerCore"></p><p id="answerIntent"></p></details><section id="followups" class="followups" aria-label="追撃質問と模範解答"></section><p id="provenance" class="provenance"></p></section>
</main>
<footer class="dock"><div class="dock-inner"><button id="prev" class="nav-step" aria-label="前の質問"><span aria-hidden="true">←</span><span>前へ</span></button><button id="reveal" class="primary" aria-controls="modelPanel" aria-expanded="false">模範解答を見る <span aria-hidden="true">＋</span></button><button id="next" class="nav-step" aria-label="次の質問"><span>次へ</span><span aria-hidden="true">→</span></button></div><p class="keyhint">← → 質問を移動 <span>SPACE 解答を表示</span></p></footer>
<dialog id="editor" aria-labelledby="editorTitle"><div class="dialog-head"><div><span class="section-label">YOUR ANSWER</span><h2 id="editorTitle">模範解答を編集</h2></div><button id="closeEditor" class="quiet" aria-label="編集画面を閉じる">閉じる ×</button></div><p id="editorQuestion" class="editor-question"></p><label class="sr-only" for="modelText">登録する模範解答</label><textarea id="modelText" maxlength="12000" rows="9" placeholder="自分の言葉で模範解答を登録"></textarea><div class="editor-meta"><span id="draftStatus"></span><span id="editChars"></span></div><div class="editor-footer"><p>この端末に保存。バックアップで移行できます。</p><button id="saveModel" class="primary" disabled>保存する <span aria-hidden="true">✓</span></button></div></dialog>
<dialog id="navigation" aria-labelledby="menuTitle"><div class="dialog-head"><h2 id="menuTitle">質問一覧</h2><button id="closeMenu" class="quiet" aria-label="メニューを閉じる">閉じる ×</button></div><div class="interviewer-tabs" role="group" aria-label="面接区分"><button class="interviewer-tab" data-mode="all" aria-pressed="true">すべて</button><button class="interviewer-tab" data-mode="department" aria-pressed="false">部長面接</button><button class="interviewer-tab" data-mode="president" aria-pressed="false">社長面接</button></div><div class="filters"><label class="sr-only" for="search">質問・模範解答を検索</label><input id="search" type="search" placeholder="質問・模範解答を検索" autocomplete="off"><label class="sr-only" for="categoryFilter">カテゴリー</label><select id="categoryFilter"><option value="">すべてのカテゴリー</option></select></div><p id="resultCount" class="muted"></p><div id="questionList"></div><details class="backup"><summary>保存データ・バックアップ</summary><p id="storageDetail" class="muted">過去の回答履歴は、この端末に保持しています。</p><button id="export" class="secondary">バックアップを書き出す</button><label class="import secondary">バックアップを読み込む<input id="import" type="file" accept="application/json,.json"></label><details><summary>過去の回答履歴</summary><div id="history"></div></details></details></dialog>
<dialog id="profile" aria-labelledby="profileTitle"><div class="dialog-head"><div><span class="section-label">INTERVIEW MODEL</span><h2 id="profileTitle">社長の評価軸</h2></div><button id="closeProfile" class="quiet" aria-label="評価軸を閉じる">閉じる ×</button></div><div id="profileContent"></div></dialog>
<div id="toast" role="status" hidden></div><script type="module" src="./reader.js?v=20261010-noir1"></script>
</body></html>
