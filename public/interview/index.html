<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店長昇進面接トレーナー</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf5ff;font-family:system-ui,sans-serif}header{padding:18px;border-bottom:1px solid #24364e;background:#0b1728;position:sticky;top:0;z-index:5}.w{max-width:1050px;margin:auto}.ey{font-size:11px;letter-spacing:.18em;color:#67dcff;font-weight:800}.t{font-size:24px;font-weight:900}.s{font-size:12px;color:#8ea5bb}main{padding:16px 12px 50px}.bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}button{border:1px solid #293e58;border-radius:11px;padding:10px 14px;background:#142238;color:#eef6ff;font-weight:800;cursor:pointer}.active,.primary{background:#67dcff;color:#03111b;border-color:#67dcff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:13px}.p{background:#0c192b;border:1px solid #21344d;border-radius:19px;padding:18px}.chips{display:flex;gap:6px}.chip{font-size:11px;background:#16283e;padding:5px 8px;border-radius:99px;color:#a9bfd2}.q{font-size:27px;line-height:1.45;margin:15px 0 8px}.hint{font-size:12px;color:#8ea5bb;line-height:1.7}textarea{width:100%;min-height:205px;background:#06101c;border:1px solid #2a425e;border-radius:14px;color:#fff;padding:14px;font-size:16px;line-height:1.75}textarea:focus{outline:none;border-color:#67dcff}.actions{display:flex;gap:8px;margin-top:9px}.actions button:first-child{flex:1}.box{margin-top:13px;padding:15px;background:#07111e;border:1px solid #223750;border-radius:15px}.score{font-size:45px;font-weight:950}.score span{font-size:12px;color:#8096aa}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:9px}.metric{background:#102138;border-radius:9px;padding:7px;font-size:10px}.metric b{display:block;font-size:16px}.ok{color:#70e1a4}.mid{color:#ffd66d}.low{color:#ff9090}.follow button{display:block;width:100%;text-align:left;margin:6px 0;background:#302815;color:#ffe3a0}.model{white-space:pre-wrap;background:#0d2035;border-radius:10px;padding:11px;line-height:1.7;margin-top:8px}.axis{padding:9px 0;border-bottom:1px solid #1c2d43}.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1c2d43}.hist{padding:8px 0;border-bottom:1px solid #1c2d43;font-size:11px}.small{color:#8298ad;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{order:-1}.metrics{grid-template-columns:repeat(3,1fr)}.q{font-size:23px}}</style></head><body>
<header><div class="w"><div class="ey">MANAGER PROMOTION INTERVIEW</div><div class="t">店長昇進面接トレーナー</div><div class="s">マルハン西日本カンパニー｜実戦練習版</div></div></header>
<main class="w"><div class="bar"><button class="active" data-mode="武山部長">武山部長</button><button data-mode="社長">社長</button><button data-mode="ランダム">ランダム</button><button id="weak">弱点集中</button><button id="reset">履歴削除</button></div><div class="layout"><section class="p"><div id="chips" class="chips"></div><div class="s" id="count"></div><div class="q" id="q"></div><div class="hint">結論→理由→具体策・経験。社長モードは特に短く、聞かれたことに答える。</div><textarea id="a" placeholder="回答を入力"></textarea><div class="actions"><button class="primary" id="judge">回答を評価</button><button id="next">次へ</button></div><div id="out"></div></section><aside class="p side"><h3>評価軸</h3><div class="axis">結論</div><div class="axis">具体性</div><div class="axis">論理</div><div class="axis">自分の経験</div><div class="axis">イズム・利益</div><div class="axis">簡潔さ</div><div class="stat"><span>回答数</span><b id="n">0</b></div><div class="stat"><span>平均</span><b id="avg">—</b></div><div class="stat"><span>最大</span><b id="max">—</b></div><h3>直近</h3><div id="hist"></div><p class="hint">今回の想定問答の原点・羽曳野・南宮崎・利益・人材・イズム・新規事業を中心に収録。</p></aside></div></main>
<script>
const Q=[
['志望動機','なぜ店長になりたいのですか？',['なぜ店長でないとできない？','南宮崎から何を変えた？','最終責任とは？'],'入社したときからの夢。最終判断と結果の責任を自分で引き受けたい。「遠回りこそ最大の近道」。南宮崎と羽曳野の失敗を結果で返す。'],
['店長像','どんな店長になりたいですか？',['利益と人、どちらを優先？','一番店とは？','スタッフをどう動かす？'],'利益を残し、稼働でも対抗店に勝つ一番店。スタッフが楽しく働き、お客様に愛される。結果と人の両方を取る。'],
['責任','店長でないとできないことは？',['分析や提案では？','責任を負う覚悟とは？'],'営業のジャッジ、経費の決裁、失敗の責任は店長にしか負えない。'],
['強み','あなたの強みは？',['判断スピードの具体例？','独善にならない？'],'課題形成から課題解決までの判断スピード。現状把握から最も効率的な解決策を導く。'],
['弱み','あなたの弱みは？',['それで失敗した？','どう克服している？'],'論理を優先して相手の感情を汲むのに時間がかかる。「どう思う？」と聞くことで補う。'],
['初動','着任したら最初に何をしますか？',['なぜ1〜2週間？','スタッフとは何を話す？'],'現場に立ち、数字と現場感覚のズレを検証。スタッフ一人ひとりと「なぜこの店で働いているか」を話す。'],
['人材','本物の人材とは？どう育てる？',['権限をどう渡す？','答えを与えないとは？'],'どんな環境でも結果を出す主体的で愛社精神のある人。権限を段階的に渡し、問いかけ、環境を変えて経験させ、本人に検証させる。'],
['失敗','一番辛かった経験は？',['なぜ結果が出なかった？','今なら何を変える？'],'南宮崎。全力を尽くしたが結果が出ず異動。準備と判断不足を認め、目的と検証方法を決める習慣につながった。'],
['羽曳野','羽曳野で利益が取れなかった原因は？',['なぜ利益への切替が遅れた？','今なら何をする？','ひよっていた？'],'対抗店の物量と稼働にこだわり、利益に舵を切るのが遅れた。南宮崎も羽曳野も準備と判断の不足。'],
['利益','「とる時にとる、出す時に出す」とは？',['メイン機は？','お客様目線と矛盾しない？'],'営業にメリハリをつける。メイン機も強気で締めてとるときはとるという姿勢を徹底する。'],
['利益','入金が取れる店長と取れない店長の違いは？',['胆力とは？','細部では何を見る？'],'金額にひるまず判断する胆力と細部の営業分析。計画、暴発時のリカバリー、赤字機種のタイムリーな確認。'],
['競合','アロー・123などに勝つには？',['物量で負けているのに？','張り合わない判断は？'],'物量では勝てない。ジャグラーへの集中、低貸の死守、独自の大海で差別化。'],
['営業','営業の指標は何を見ますか？',['売上だけでは？','利益を残す構造とは？'],'売上と利益。売上を上げて利益を出す構造をつくる。'],
['機械','機械をどう評価しますか？',['何を見て買う？','調整は？'],'コイン単価、スペック、販売台数を見る。お客様が「頑張れば勝てる」と感じる調整を考える。'],
['新規事業','新規事業をやるなら？',['一番やりたい？','なぜマルハンが？','採算は？'],'郊外の閉店店舗跡地を活用。インドア・セルフストレージ、スポーツ&ウェルネス、EV急速充電ハブを候補にする。'],
['シニア','シニア・ウェルネス事業を具体化して？',['どう集客？','初期投資は？','利益は？'],'スポーツ&ウェルネスを軸に、広い空間・駐車場・接客力・運営ノウハウを活用する。'],
['MIRACLE WORLD','MIRACLE WORLDに改善点があるとすれば？',['一回で終わらせないには？','最初に見る数字は？'],'一回の来場で終わらせずリピート・口コミへ。季節コンテンツ、SNS、なんばのホテル・飲食・観光との導線、データ検証。'],
['イズム','マルハンイズムで一番大事なのは？',['なぜ経営理念？','店長としてどう落とす？'],'経営理念の「人生にヨロコビを」。各項目は最終的にここにつながる。'],
['イズム','自分が特にこだわるイズムは？',['安心・刺激・やすらぎとは？','利益と両立する？'],'提供価値の「安心・刺激・やすらぎ」を特に重視する。'],
['組織','西日本カンパニーの課題は？',['なぜ起きる？','店長ならどう変える？'],'次世代人材育成、伝える側のレベル、スピード感、自分ごと化、新しい発想。自ら考え参画し挑戦する組織へ。'],
['上司','納得できない上司の指示が来たら？',['反対意見は？','最後は？'],'従う。上司のビジョン達成が店長の役割。ただし自分の考えは必ず伝える。'],
['AI','今挑戦していることは？',['なぜAI？','現場にどう還元？'],'AIを使った分析ツールの自作。作業を効率化し、浮いた時間を現場とスタッフに使う。'],
['人物','座右の銘は？',['仕事でどう実践？'],'「遠回りこそ最大の近道」。もう一つは「発言は現実になる」。'],
['社長','店長を任せても大丈夫ですか？',['本当にできますか？'],'はい。どの店舗に任されても、入金を取りに行き、利益を残し、諦めない。'],
['社長','今の羽曳野を任されたら黒字にできますか？',['何をやめる？','最初の一手は？'],'はい。強みへの集中投資と経費の最適化で黒字転換を計画する。厳しくても自分でコントロールできる部分を徹底する。'],
['社長','なぜあなたを店長にする必要がありますか？',['他候補との違いは？'],'判断スピード、戦略性、現場主義、失敗から逃げない強さ。'],
['社長','数字が悪化したら最初に何をする？',['誰に相談？','何を捨てる？'],'原因を数字と現場に分解し、利益への影響が大きいところから止血する。'],
['社長','競合がさらに投資してきたら？',['また稼働を追う？'],'同じ土俵で張り合わない。自店の強みを守り、勝てる領域へ集中する。'],
['社長','新規事業が赤字なら？',['挑戦だから続ける？'],'挑戦したことではなく成果までが事業。数字を見て継続・縮小・撤退を判断する。'],
['社長','最後に一言。',['どんな店長になる？','覚悟は？'],'どの店舗に任されても入金を取りに行き、利益を残し、諦めない。']
].map((x,i)=>({id:i+1,tag:x[0],q:x[1],f:x[2],model:x[3],modes:x[0]==='社長'?['社長','ランダム']:['武山部長','社長','ランダム']}));

let mode='武山部長',i=0,weak=false,h=JSON.parse(localStorage.getItem('mi-h')||'[]');const $=x=>document.getElementById(x);
function list(){let a=Q.filter(x=>x.modes.includes(mode));if(weak)a=a.filter(x=>!h.some(z=>z.qid===x.id&&z.score>=80));return a}
function draw(){let a=list();if(!a.length){$('q').textContent='弱点はありません。全問80点以上です。';return}if(i>=a.length)i=0;let x=a[i];$('chips').innerHTML='<span class="chip">'+x.tag+'</span><span class="chip">'+mode+'</span>';$('count').textContent=(i+1)+' / '+a.length;$('q').textContent=x.q;$('a').value='';$('out').innerHTML=''}
function judge(){let a=$('a').value.trim();if(!a)return;let x=list()[i],A=[a.length?20:0,/具体|例えば|数字|経験|南宮崎|羽曳野|現場/.test(a)?20:7,a.length>=65&&/[だから|そのため|一方|ただし|まず|次に]/.test(a)?15:7,/南宮崎|羽曳野|なんば|自分|経験|実際/.test(a)?15:6,/利益|入金|粗利|売上|採算|経費|数字|黒字|イズム|お客様/.test(a)?20:7,a.length<=160?10:5],S=A.reduce((p,c)=>p+c,0),weak=A.map((v,k)=>v<12?['結論','具体性','論理','経験','イズム・利益','簡潔さ'][k]:null).filter(Boolean),cl=S>=80?'ok':S>=60?'mid':'low';h.unshift({qid:x.id,q:x.q,score:S,weak,date:new Date().toLocaleString('ja-JP'),mode});h=h.slice(0,30);localStorage.setItem('mi-h',JSON.stringify(h));$('out').innerHTML='<div class="box"><div class="score '+cl+'">'+S+'<span>/100</span></div><div class="metrics">'+A.map((v,k)=>'<div class="metric">'+['結論','具体性','論理','経験','軸','簡潔'][k]+'<b>'+v+'</b></div>').join('')+'</div><p class="hint">'+(S>=85?'かなり強い。次は社長の追撃へ。':S>=70?'合格圏に近い。弱点を一つ潰す。':'まだ薄い。結論→理由→経験まで。')+'</p>'+(weak.length?'<p><b>弱点：</b>'+weak.join(' / ')+'</p>':'<p class="ok"><b>大きな弱点なし。</b></p>')+'<div class="follow"><b>追撃質問</b>'+x.f.map(z=>'<button data-f="'+z.replaceAll('"','&quot;')+'">'+z+'</button>').join('')+'</div><button id="mb">模範回答の軸</button><div id="model" class="model" style="display:none">'+x.model+'</div></div>';stats()}
function stats(){let n=h.length;$('n').textContent=n;$('avg').textContent=n?Math.round(h.reduce((a,x)=>a+x.score,0)/n):'—';$('max').textContent=n?Math.max(...h.map(x=>x.score)):'—';$('hist').innerHTML=h.slice(0,5).map(x=>'<div class="hist"><b>'+x.score+'点｜'+x.mode+'</b><span class="small">'+x.q+'</span></div>').join('')}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;weak=false;i=0;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));$('weak').classList.remove('active');draw()});
$('judge').onclick=judge;$('next').onclick=()=>{i++;draw()};$('weak').onclick=()=>{weak=!weak;i=0;$('weak').classList.toggle('active',weak);draw()};$('reset').onclick=()=>{if(confirm('履歴を削除しますか？')){h=[];localStorage.removeItem('mi-h');stats()}};$('out').addEventListener('click',e=>{if(e.target.dataset.f){$('q').textContent=e.target.dataset.f;$('a').value='';$('out').innerHTML='<div class="box"><b>追撃です。</b><p class="hint">短く、結論→理由→具体策で答える。</p></div>'}if(e.target.id==='mb'){$('model').style.display=$('model').style.display==='none'?'block':'none'}});draw();stats();
</script></body></html>
