<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>パスワード再設定 | 面接練習</title><link rel="stylesheet" href="./reader.css?v=20261014-auth1"><style>body{min-height:100dvh;display:grid;place-items:center;padding:24px}.reset-card{width:min(100%,480px);padding:32px;border:1px solid #d6bd8640;border-radius:18px;background:#111}h1{font-size:26px}form{display:grid;gap:14px}input{width:100%;min-height:48px;padding:12px;background:#161616;color:#eee;border:1px solid #d6bd8650;border-radius:8px}label{font-size:13px}.primary{max-width:none;width:100%}.reset-status{line-height:1.8;color:#dac39b;font-size:14px}a{display:inline-block;margin-top:24px;color:#dac39b}.muted{line-height:1.8}button:disabled{opacity:.5}</style></head>
<body><main class="reset-card"><span class="section-label">YOUR ACCOUNT</span><h1>パスワードを再設定</h1><p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
<form id="requestReset"><p class="muted">登録したメールアドレスへ再設定リンクを送ります。</p><label for="resetEmail">メールアドレス</label><input id="resetEmail" type="email" autocomplete="email" required><button id="sendReset" class="primary" type="submit">再設定メールを送る</button></form>
<form id="changePassword" hidden><p class="muted">新しいパスワードを設定してください。</p><label for="newPassword">新しいパスワード（8文字以上）</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPassword">もう一度入力</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button id="resetPasswordToggle" type="button" class="edit-button" aria-pressed="false">パスワードを表示</button><button id="savePassword" class="primary" type="submit">新しいパスワードを保存</button></form>
<a href="./?login=1&amp;v=20261014-auth1">面接のログインへ戻る →</a></main><script type="module" src="./password-reset-page.js?v=20261014-auth1"></script></body></html>
